name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Vite 7 requires Node ^20.19 || >=22.12; pin to 22 to match local dev.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test

      # ESLint flat config (eslint.config.js) — fails the build on lint errors.
      - name: Lint
        run: npm run lint

  ux-audit:
    name: UX audit (axe + Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Pin both tools to the same browser binary rather than whatever Chrome
      # happens to ship in the runner image, so a runner-image bump can't move
      # the Lighthouse scores or the axe results underneath us.
      - name: Pin browser for both audits
        run: node -e "console.log('CHROME_PATH=' + require('@playwright/test').chromium.executablePath())" >> "$GITHUB_ENV"

      # Both audits run against `vite preview`, which serves the built app —
      # so the build has to happen first. The Supabase values are throwaway:
      # src/lib/supabase.ts throws at import time when they're missing, which
      # would leave every audited page blank. Nothing ever reaches Supabase.
      # VITE_API_URL is left at its default (/api) so the Playwright request
      # stub matches it.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://stub.supabase.co
          VITE_SUPABASE_ANON_KEY: stub-anon-key

      - name: Accessibility (axe, WCAG 2.1 AA)
        run: npm run test:a11y

      - name: Lighthouse
        run: npm run test:lighthouse

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore
          # .lighthouseci is a dot-directory, and upload-artifact skips hidden
          # files by default — without this the Lighthouse reports are silently
          # dropped and only the Playwright report survives.
          include-hidden-files: true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # npm audit reads package-lock.json directly, so this job needs no install
      # (hence no npm cache). Informational: report known-high vulnerabilities to
      # the logs without failing
      # the check, since current advisories are all in transitive dev-only tooling.
      # Remediation is driven by Dependabot (see .github/dependabot.yml). The `|| true`
      # keeps the check green; drop it to make the audit blocking once deps are clean.
      - name: Audit dependencies (informational)
        run: npm audit --audit-level=high || true
