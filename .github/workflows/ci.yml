name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test

      # No-op until a "lint" script exists (see issue #165); runs automatically once added.
      - name: Lint
        run: npm run lint --if-present

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational: surfaces known-vulnerable dependencies without blocking PRs,
    # since most current advisories are in transitive dev-only tooling.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high
