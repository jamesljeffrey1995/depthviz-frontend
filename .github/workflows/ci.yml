name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node ^20.19 || >=22.12; pin to 22 to match local dev.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test

      # No-op until a "lint" script exists (see issue #165); runs automatically once added.
      - name: Lint
        run: npm run lint --if-present

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm audit reads package-lock.json directly, so this job needs no install
      # (hence no npm cache). Informational: report known-high vulnerabilities to
      # the logs without failing
      # the check, since current advisories are all in transitive dev-only tooling.
      # Remediation is driven by Dependabot (see .github/dependabot.yml). The `|| true`
      # keeps the check green; drop it to make the audit blocking once deps are clean.
      - name: Audit dependencies (informational)
        run: npm audit --audit-level=high || true
